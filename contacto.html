<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de contacto · VIAJA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f4;color:#26352f}
header{background:#fff;border-bottom:1px solid #dfe7e2;padding:22px 7%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:800;letter-spacing:3px;color:#315b4d}
main{max-width:1050px;margin:45px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(39,67,57,.08)}
h1{margin:0 0 10px;color:#315b4d;font-size:30px}
.subtitle{margin:0 0 25px;color:#68766f}
.summary{line-height:1.65;color:#43534c}
.summary strong{color:#315b4d}
.form-group{margin-bottom:17px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid #cfdad4;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#527d6d;box-shadow:0 0 0 3px rgba(82,125,109,.12)}
button{width:100%;padding:14px;border:0;border-radius:11px;background:#315b4d;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.message{margin-top:14px;padding:12px;border-radius:10px;display:none}
.message.error{display:block;background:#fbeaea;color:#9b3333}
.message.success{display:block;background:#eaf5ee;color:#2f6949}
@media(max-width:760px){main{grid-template-columns:1fr;margin-top:25px}.card{padding:22px}}
</style>
</head>
<body>
<header><div class="logo">VIAJA</div></header>

<main>
<section class="card">
<h1>Tu viaje</h1>
<p class="subtitle">Comprueba los datos de tu solicitud antes de continuar.</p>
<div id="summary" class="summary">Cargando búsqueda...</div>
</section>

<section class="card">
<h1>Datos de contacto</h1>
<p class="subtitle">Déjanos tus datos para poder contactar contigo sobre el viaje.</p>
<form id="contactForm">
<div class="form-group"><label for="name">Nombre y apellidos *</label><input id="name" name="name" required></div>
<div class="form-group"><label for="phone">Teléfono *</label><input id="phone" name="phone" type="tel" required></div>
<div class="form-group"><label for="email">Correo electrónico *</label><input id="email" name="email" type="email" required></div>
<button id="submitButton" type="submit">Enviar solicitud</button>
<div id="message" class="message"></div>
</form>
</section>
</main>

<script>
const search=JSON.parse(localStorage.getItem('ultimaBusqueda')||'null');
const summary=document.getElementById('summary');
const form=document.getElementById('contactForm');
const message=document.getElementById('message');
const submitButton=document.getElementById('submitButton');

function formatDate(value){
  if(!value) return '';
  const d=new Date(value+'T00:00:00');
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function flexibleLabel(type,month,days){
  const names={weekend:'Un finde',week:'1 semana',month:'1 mes',other:'Otro'};
  let text=names[type]||'';
  if(type==='other') text += days!=null ? ` (${days} días)` : '';
  if(month) text += ` · Mes: ${month}`;
  return text;
}
function renderSummary(){
  if(!search){
    summary.innerHTML='<strong>No se ha encontrado la búsqueda.</strong><br>Vuelve a la página principal y realiza una nueva búsqueda.';
    submitButton.disabled=true;
    return;
  }
  let html=`<strong>Origen:</strong> ${search.origin||'-'}<br>`;
  html+=`<strong>Destino:</strong> ${search.destination||'-'}<br>`;
  if(search.dateType==='concrete'){
    html+=`<strong>Fechas:</strong> ${formatDate(search.departure)} → ${formatDate(search.return)}<br>`;
  }else{
    html+=`<strong>Fechas flexibles:</strong> ${flexibleLabel(search.flexibleType,search.selectedMonth,search.flexibleDays)}<br>`;
  }
  html+=`<strong>Habitaciones:</strong> ${search.rooms||0}<br>`;
  html+=`<strong>Personas:</strong> ${search.adults||0} adultos, ${search.children||0} niños<br>`;
  if(Array.isArray(search.roomData)){
    search.roomData.forEach((room,i)=>{
      html+=`<strong>Habitación ${i+1}:</strong> ${room.adults} adultos, ${room.children.length} niños`;
      if(room.children.length) html+=` (${room.children.join(', ')} años)`;
      html+='<br>';
    });
  }
  if(search.multidestination){
    html+='<hr style="border:0;border-top:1px solid #e3e9e5;margin:16px 0">';
    html+=`<strong>Segundo trayecto:</strong> ${search.origin2||'-'} → ${search.destination2||'-'}<br>`;
    if(search.departure2){
      html+=`<strong>Fechas:</strong> ${formatDate(search.departure2)} → ${formatDate(search.return2)}<br>`;
    }else{
      html+=`<strong>Fechas flexibles:</strong> ${flexibleLabel(search.flexibleType2,search.selectedMonth2,search.flexibleDays2)}<br>`;
    }
  }
  summary.innerHTML=html;
}

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  message.className='message';
  message.textContent='';
  submitButton.disabled=true;
  submitButton.textContent='Enviando...';

  const contact={
    name:document.getElementById('name').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    email:document.getElementById('email').value.trim()
  };

  try{
    const response=await fetch('https://TU-BACKEND.com/api/solicitud',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contact,search})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||'No se pudo enviar la solicitud.');
    message.className='message success';
    message.textContent='Solicitud enviada correctamente. Nos pondremos en contacto contigo cuando encontremos el viaje.';
    form.reset();
  }catch(error){
    message.className='message error';
    message.textContent=error.message;
    submitButton.disabled=false;
    submitButton.textContent='Enviar solicitud';
  }
});

renderSummary();
</script>
</body>
</html>
